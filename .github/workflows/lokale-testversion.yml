name: Lokale Testversion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:standalone
      - run: |
          mkdir -p windows-test
          cp standalone/index.html windows-test/Lagerraum.html
      - uses: actions/upload-artifact@v4
        with:
          name: Lagerraum-Windows-Test
          path: windows-test/Lagerraum.html
          if-no-files-found: error
